apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-deployment
  labels:
    environment: production  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: nghia5/flask-api:v1
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "100Mi"
              cpu: "200m"
            limits:
              memory: "400Mi"
              cpu: "300"